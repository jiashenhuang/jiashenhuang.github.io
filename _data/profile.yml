short_bio_text_justify: false
short_bio: >-
  <p>
    I am currently a Research Assistant with the <a href="https://annenberg.usc.edu/">USC Annenberg School for Communication and Journalism</a>. 
    My research focuses on <em>AI trust</em>, <em>psychological communication</em>, and <em>human–AI interaction</em>, 
    examining how emerging technologies shape human behavior, media trust, and technology-mediated communication.
  </p>

  <p>
    I hold both a Bachelor’s degree and a Master of Arts degree from the 
    <a href="https://journal.whu.edu.cn/">School of Journalism and Communication</a> at 
    <a href="https://en.whu.edu.cn/">Wuhan University</a>. 
    Previously, I worked as a remote Research Assistant at 
    <a href="https://www.tsinghua.edu.cn/en/">Tsinghua University</a> and 
    <a href="https://www.ntu.edu.sg/">Nanyang Technological University</a>. 
    My professional experiences at 
    <a href="https://www.cctv.com/gyys/">China Media Group</a>, 
    <a href="https://www.meituan.com/en-US/about-us">Meituan</a>, and 
    <a href="https://en.bluefocus.com/">Blue Focus Digital</a> have strengthened my skills in research, data analysis, and digital communication.
  </p>

  <p>
    I am currently seeking Ph.D. opportunities to advance research on <em>AI-driven communication</em>, 
    <em>online safety</em>, and the societal implications of emerging technologies. 
    I welcome opportunities for collaboration and scholarly discussion in these areas.
  </p>

