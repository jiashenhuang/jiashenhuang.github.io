short_bio: >-
  <p>
    I am currently working as a remote Research Assistant at the <a href="https://www.ntu.edu.sg/wkwsci">Wee Kim Wee School of Communication and Information (WKWSCI)</a>, 
    <a href="https://www.ntu.edu.sg/">Nanyang Technological University (NTU)</a>, Singapore,
    under the guidance of <a href="https://renwenzhang.com/">Asst. Prof. Renwen Zhang</a>. 
    My research focuses on <em>AI trust</em> and <em>psychological communication</em>, 
    exploring how emerging technologies influence human behavior and trust in media at the intersection of communication, sociology, and psychology. 
  </p>
  <p> 
    I hold both a Bachelor’s and a Master of Arts degree from the <a href="https://journal.whu.edu.cn/">School of Journalism and Communication</a> at <a href="https://en.whu.edu.cn/">Wuhan University</a>. 
    My professional experiences at <a href="https://www.cctv.com/gyys/">China Media Group</a>, 
    <a href="https://www.meituan.com/en-US/about-us">Meituan</a>, 
    and <a href="https://en.bluefocus.com/">Blue Focus Digital</a> have provided practical skills in research and data analysis. 
    I am seeking PhD opportunities to advance research on <em>AI-driven communication</em> and its societal impact, 
    and I welcome collaboration and discussion in this field. 
  </p>

